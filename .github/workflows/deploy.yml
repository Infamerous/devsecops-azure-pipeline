name: DevSecOps Pipeline

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC -> Azure
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scan tools
        run: pip install pip-audit bandit

      - name: Dependency scan (pip-audit)
        run: pip-audit -r requirements.txt

      - name: SAST (bandit)
        run: bandit -r . -x ./tests

  build-and-push:
    name: Build image and push to ACR
    needs: scan
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image (ACR Tasks)
        id: build
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_NAME:$IMAGE_TAG" \
            .
          echo "image=$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy via Azure Run Command
        run: |
          az vm run-command invoke \
            --resource-group "$RESOURCE_GROUP" \
            --name "${{ vars.STAGING_VM_NAME }}" \
            --command-id RunShellScript \
            --scripts "
              az login --identity &&
              az acr login --name $ACR_NAME &&
              docker pull ${{ needs.build-and-push.outputs.image }} &&
              docker rm -f app || true &&
              docker run -d --name app -p 8080:8080 -e ENVIRONMENT=staging -e APP_VERSION=${{ github.sha }} ${{ needs.build-and-push.outputs.image }}
            "

  deploy-production:
    name: Deploy to Production
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    environment: production   # configure a required reviewer on this Environment in repo settings
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy via Azure Run Command
        run: |
          az vm run-command invoke \
            --resource-group "$RESOURCE_GROUP" \
            --name "${{ vars.PRODUCTION_VM_NAME }}" \
            --command-id RunShellScript \
            --scripts "
              az login --identity &&
              az acr login --name $ACR_NAME &&
              docker pull ${{ needs.build-and-push.outputs.image }} &&
              docker rm -f app || true &&
              docker run -d --name app -p 8080:8080 -e ENVIRONMENT=production -e APP_VERSION=${{ github.sha }} ${{ needs.build-and-push.outputs.image }}
            "
